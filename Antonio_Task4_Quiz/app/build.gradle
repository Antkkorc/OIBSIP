plugins {
    id 'com.android.application'
}

android {
    namespace 'bw.oibsip.passage'
    compileSdk 34

    defaultConfig {
        applicationId "bw.oibsip.passage"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Source files contain typographic characters (degree signs, minus signs, division signs).
    // Pin the compiler to UTF-8 so a Windows machine with a cp1252 default cannot corrupt them.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
}
